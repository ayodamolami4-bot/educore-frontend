server.port=8094
spring.application.name=educore-communication
spring.datasource.url=${COMMUNICATION_DATABASE_URL}
spring.datasource.username=${COMMUNICATION_DATABASE_USER}
spring.datasource.password=${COMMUNICATION_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.flyway.locations=classpath:db/common,classpath:db/migration
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Optional asynchronous SMTP must not make in-app communication unavailable.
management.health.mail.enabled=false
educore.service-name=communication
educore.identity-url=${IDENTITY_URL:http://localhost:8091}
educore.academics-url=${ACADEMICS_URL:http://localhost:8092}
educore.communication-url=${COMMUNICATION_URL:http://localhost:8094}

educore.email-enabled=${EDUCORE_EMAIL_ENABLED:false}
educore.mail-from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
educore.result-encryption-key=${COMMUNICATION_RESULT_ENCRYPTION_KEY}
educore.peers.identity=${IDENTITY_TO_COMMUNICATION_KEY}
educore.peers.academics=${ACADEMICS_TO_COMMUNICATION_KEY}
educore.peers.finance=${FINANCE_TO_COMMUNICATION_KEY}
educore.outgoing.identity-key=${COMMUNICATION_TO_IDENTITY_KEY}
educore.outgoing.academics-key=${COMMUNICATION_TO_ACADEMICS_KEY}
