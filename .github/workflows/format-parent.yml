name: Format Parent implementation
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/parent-complete' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Format Parent portal files
        run: npx prettier --write src/features/parent/api/parentApi.js src/features/parent/models/ParentModel.js src/features/parent/README.md src/features/parent/views/ParentAcademicScreen.jsx src/features/parent/views/ParentCommunicationScreen.jsx src/features/parent/views/ParentHomeScreen.jsx src/features/parent/views/ParentNavigator.jsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/parent
          git commit -m "Format Parent portal implementation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
