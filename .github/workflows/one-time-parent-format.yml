name: One-time Parent formatting
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/parent-complete' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Sync latest pull request branch
        run: |
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git reset --hard "origin/${{ github.event.pull_request.head.ref }}"
      - run: npm ci
      - name: Format Parent implementation
        run: npx prettier --write src/features/parent
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/parent
          git commit -m "Format Parent portal implementation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
