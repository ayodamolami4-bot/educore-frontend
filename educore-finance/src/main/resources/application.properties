server.port=8093
spring.application.name=educore-finance
spring.datasource.url=${FINANCE_DATABASE_URL}
spring.datasource.username=${FINANCE_DATABASE_USER}
spring.datasource.password=${FINANCE_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.flyway.locations=classpath:db/common,classpath:db/migration
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
educore.service-name=finance
educore.identity-url=${IDENTITY_URL:http://localhost:8091}
educore.academics-url=${ACADEMICS_URL:http://localhost:8092}
educore.communication-url=${COMMUNICATION_URL:http://localhost:8094}

educore.paystack-key=${PAYSTACK_SECRET_KEY:}
educore.paystack-base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
educore.result-encryption-key=${FINANCE_RESULT_ENCRYPTION_KEY}
educore.outgoing.identity-key=${FINANCE_TO_IDENTITY_KEY}
educore.outgoing.academics-key=${FINANCE_TO_ACADEMICS_KEY}
educore.outgoing.communication-key=${FINANCE_TO_COMMUNICATION_KEY}
