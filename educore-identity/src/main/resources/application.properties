server.port=8091
spring.application.name=educore-identity
spring.datasource.url=${IDENTITY_DATABASE_URL}
spring.datasource.username=${IDENTITY_DATABASE_USER}
spring.datasource.password=${IDENTITY_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.flyway.locations=classpath:db/common,classpath:db/migration
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
educore.service-name=identity
educore.identity-url=${IDENTITY_URL:http://localhost:8091}
educore.academics-url=${ACADEMICS_URL:http://localhost:8092}
educore.communication-url=${COMMUNICATION_URL:http://localhost:8094}
educore.result-encryption-key=${IDENTITY_RESULT_ENCRYPTION_KEY}
educore.peers.academics=${ACADEMICS_TO_IDENTITY_KEY}
educore.peers.finance=${FINANCE_TO_IDENTITY_KEY}
educore.peers.communication=${COMMUNICATION_TO_IDENTITY_KEY}
educore.outgoing.communication-key=${IDENTITY_TO_COMMUNICATION_KEY}
